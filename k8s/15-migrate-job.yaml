apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: communityplatform
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: communityplatform-api:v26
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: 'postgresql://postgres:postgres@db:5432/samfallighet?schema=public'
          command:
            [
              'sh',
              '-lc',
              'cd /app/apps/api && /app/node_modules/.bin/prisma migrate deploy',
            ]
